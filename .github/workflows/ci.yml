name: "Editor's Draft"

on:
  push:
    branches-ignore:
      - gh-pages
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'LICENSE.md'
  pull_request:
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'LICENSE.md'
  workflow_dispatch:

jobs:
  build:
    name: "Build Internet-Drafts"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: "Build all drafts"
        uses: martinthomson/i-d-template@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "Publish to gh-pages"
        if: ${{ github.event_name != 'pull_request' }}
        uses: martinthomson/i-d-template@v1
        with:
          make: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
